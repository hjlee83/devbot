name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"

      - name: uv sync
        run: uv sync

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: uv run pytest
        run: uv run pytest

      - name: uv run devbot
        run: uv run devbot
        env:
          # No .env is committed; devbot requires WORKSPACE_ROOT to start.
          # config/repositories.yaml ships its sample repository disabled,
          # so no repository path under this root needs to actually exist.
          WORKSPACE_ROOT: ${{ runner.temp }}
