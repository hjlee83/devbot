name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"

      - name: uv sync
        run: uv sync

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: uv run pytest
        run: uv run pytest

      - name: uv run devbot --once --dry-run
        run: |
          cat > "$RUNNER_TEMP/repositories.yaml" <<'EOF'
          repositories:
            - owner: hjlee83
              repo: devbot
              enabled: false
              default_branch: main
          EOF
          uv run devbot --once --dry-run
        env:
          WORKSPACE_ROOT: ${{ runner.temp }}
          DEVBOT_REPOSITORIES_PATH: ${{ runner.temp }}/repositories.yaml
          GITHUB_TOKEN: ${{ github.token }}
