name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.13"

      - name: uv sync
        run: uv sync

      - name: uv run ruff check .
        run: uv run ruff check .

      - name: uv run pytest
        run: uv run pytest

      - name: uv run devbot --once
        run: uv run devbot --once
        env:
          # No .env is committed; devbot requires WORKSPACE_ROOT and
          # GITHUB_TOKEN to start. config/repositories.yaml ships its
          # sample repository disabled, so no repository path needs to
          # actually exist and no real GitHub API call is ever made.
          # --once is required here: bare `uv run devbot` runs the
          # continuous polling loop and would never return.
          WORKSPACE_ROOT: ${{ runner.temp }}
          GITHUB_TOKEN: ci-placeholder-token
